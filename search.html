<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>TabAmber — Search Suspended Tabs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    #query {
      flex: 1;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #query:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
    }

    #results {
      list-style: none;
    }

    #results li {
      padding: 10px 12px;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: background 0.1s;
    }

    #results li:hover {
      background: #f0f4ff;
      border-color: #c5d5fa;
    }

    #results li .favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    #results li .info { flex: 1; overflow: hidden; }

    #results li .title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #results li .url {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #results li .age {
      font-size: 11px;
      color: #aaa;
      flex-shrink: 0;
      white-space: nowrap;
      align-self: center;
    }

    .highlight { background: #fff176; border-radius: 2px; }

    #empty {
      color: #888;
      font-size: 14px;
      text-align: center;
      margin-top: 40px;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #d4d4d4; }
      #query { background: #2d2d2d; color: #d4d4d4; border-color: #555; }
      #query:focus { border-color: #4a9eff; }
      #results li { border-color: #404040; }
      #results li:hover { background: #2a2f44; border-color: #4a5a8a; }
      #results li .url { color: #777; }
      #results li .age { color: #666; }
      .subtitle { color: #666; }
      #empty { color: #666; }
      .highlight { background: #665500; color: #ffe082; }
    }
  </style>
</head>

<body>
  <h1>🔍 Search Suspended Tabs</h1>
  <div class="subtitle" id="subtitle">Loading…</div>

  <div class="search-row">
    <input type="search" id="query" placeholder="Search by title, URL, or domain…" autocomplete="off" spellcheck="false">
  </div>

  <ul id="results"></ul>
  <div id="empty" style="display:none;">No results found.</div>

  <script src="search.js"></script>
</body>

</html>
